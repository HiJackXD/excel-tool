[package]
name = "excel-tool"
version = "1.0.0"
description = "Excel Column Selector Tool"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
calamine = "0.26"
rust_xlsxwriter = "0.94"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
